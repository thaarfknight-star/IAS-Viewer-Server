# MediaMTX static config for IAS-Viewer-Server.
# Camera paths are generated by: python3 tools/gen_mediamtx.py
# (reads backend/cameras.json). Do not edit the paths section by hand.

logLevel: info
api: yes

hls: yes
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 2s
hlsPartDuration: 200ms

webrtc: yes

# --- generated paths below (tools/gen_mediamtx.py) ---

paths:
