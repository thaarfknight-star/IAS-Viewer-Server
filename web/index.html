<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAS Viewer — اتاق مانیتورینگ</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
<header>
  <h1>IAS Viewer <span>— اتاق مانیتورینگ</span></h1>
  <div class="controls">
    <select id="monitorSel" title="مانیتور"></select>
    <button id="addCam" title="افزودن دوربین">＋ افزودن دوربین</button>
    <a class="btn" href="recordings.html">🎞 ضبط‌شده‌ها</a>
    <button id="fsAll" title="تمام‌صفحه">⛶</button>
  </div>
</header>
<main id="grid"></main>

<div id="dlgBack" class="dlg-back" style="display:none">
  <div class="dlg">
    <h3>افزودن دوربین</h3>
    <label>نام دوربین<input id="fName" placeholder="مثلاً: ورودی اصلی"></label>
    <div class="row2">
      <label>IP دوربین<input id="fHost" dir="ltr" placeholder="192.168.1.137"></label>
      <label class="w-port">پورت<input id="fPort" dir="ltr" value="554"></label>
    </div>
    <div class="row2">
      <label>یوزر<input id="fUser" dir="ltr" placeholder="admin"></label>
      <label>پسورد<input id="fPass" dir="ltr" type="password" placeholder="••••••"></label>
    </div>
    <label>مسیر استریم (اختیاری — خالی = جستجوی خودکار)<input id="fPath" dir="ltr" placeholder="/Streaming/Channels/101"></label>
    <label>مانیتور<select id="fMon"></select></label>
    <p id="dlgErr" class="err"></p>
    <div class="dlg-actions">
      <button id="dlgOk">افزودن و تست اتصال</button>
      <button id="dlgCancel" class="ghost">انصراف</button>
    </div>
  </div>
</div>
<footer><small>IAS-Viewer-Server — AGPL-3.0</small></footer>
<script src="app.js"></script>
</body>
</html>
